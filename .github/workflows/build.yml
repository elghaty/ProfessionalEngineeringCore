name: Build Professional Engineering Core

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release AAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/bin/sdkmanager"
          fi

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        run: |
          set -euxo pipefail

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Clean
        run: |
          set -euxo pipefail
          gradle clean --no-daemon

      - name: Run Unit Tests
        run: |
          set -euxo pipefail
          gradle :app:test --no-daemon --stacktrace

      - name: Build Release AAR
        run: |
          set -euxo pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify AAR
        run: |
          set -euxo pipefail

          AAR="app/build/outputs/aar/app-release.aar"

          test -f "$AAR"

          mkdir -p app/build/outputs/aar/ProfessionalEngineeringCore

          cp "$AAR" \
            app/build/outputs/aar/ProfessionalEngineeringCore.aar

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: ProfessionalEngineeringCore-AAR
          path: app/build/outputs/aar/ProfessionalEngineeringCore.aar
          if-no-files-found: error
