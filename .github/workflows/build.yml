
name: Build Professional Engineering Core

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Core Library
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify Gradle
        run: gradle --version

      - name: Clean
        run: gradle clean --stacktrace

      - name: Compile and test
        run: gradle :app:test --stacktrace

      - name: Build Release AAR
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify AAR
        run: |
          test -f app/build/outputs/aar/app-release.aar
          ls -lh app/build/outputs/aar/app-release.aar

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: professional-engineering-core
          path: app/build/outputs/aar/app-release.aar
