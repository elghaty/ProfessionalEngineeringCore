name: Build Professional Engineering Core

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Core Library
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools

      - name: Install required Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Clean
        run: ./gradlew clean --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:test --stacktrace

      - name: Build Release AAR
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify AAR
        run: |
          test -f app/build/outputs/aar/app-release.aar

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: professional-engineering-core
          path: app/build/outputs/aar/app-release.aar
